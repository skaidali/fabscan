<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FabScan</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
        <div class="logo">FabScan <span>Web</span></div>
        <nav>
            <button onclick="loadPage('./home.html')" class="active">Général</button>
            <button onclick="loadPage('./scan.html')">Scanner</button>
            <button onclick="loadPage('./users.html')">Utilisateurs</button>
            <button onclick="loadPage('./machines.html')">Machines</button>
            <button onclick="loadPage('./reservations.html')">Réservations</button>
            <button onclick="loadPage('./bills.html')">Comptabilité</button>
            <button onclick="loadPage('./stats.html')">Statistiques</button>
        </nav>
    </header>
  

  <button onclick="loadPage('home.html')">Accueil</button>

  <!-- ICI on met la zone dynamique -->
  <div id="content" style="margin-top:20px;"></div>

  <script>
    function loadPage(page) {
      fetch(page)
        .then(response => response.text())
        .then(data => {
          document.getElementById('content').innerHTML = data;
        })
        .catch(error => {
          console.error("Erreur :", error);
        });
    }

  </script>

</body>
</html>
