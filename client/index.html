<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <title>FabScan</title>
</head>

<body>

<h1>Mon Site</h1>

  <button onclick="loadPage('home.html')">Accueil</button>
  
  
  <script>
    function loadPage(page) {
      fetch(page)
        .then(response => response.text())
        .then(data => {
          document.getElementById('content').innerHTML = data;
        });
    }

    loadPage('home.html');
  </script>
</body>
