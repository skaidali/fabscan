<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FabScan</title>
</head>

<body>

  <h1>Mon Site</h1>

  <button onclick="loadPage('home.html')">Accueil</button>

  <!-- ICI on met la zone dynamique -->
  <div id="content" style="margin-top:20px;"></div>

  <script>
    function loadPage(page) {
      fetch(page)
        .then(response => response.text())
        .then(data => {
          document.getElementById('content').innerHTML = data;
        })
        .catch(error => {
          console.error("Erreur :", error);
        });
    }

  </script>

</body>
</html>
