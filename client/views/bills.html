<div id="content">
        <h1>Comptabilité !!</h1>
        <p>Gérer les balances des utilisateurs — recherche par nom/prénom ou identifiant.</p>

        <!-- Balance panel (inline) -->
        <div id="balancePanel">
            <h2 style="margin-top:0">Gestion des soldes</h2>
            <div>
                <input id="balSearch" placeholder="Nom, prénom ou identifiant">
                <button id="balSearchBtn" class="btn primary">Rechercher</button>
            </div>

            <div id="balResults"></div>

            <div id="balEditor">
                <h3 id="balName"></h3>
                <p class="muted">ID: <span id="balId"></span></p>
                <p>Balance actuelle: <strong id="balAmount">0.00</strong> €</p>

                <div>
                    <input id="balDelta" type="number" step="0.01" placeholder="Montant (+/-)">
                    <button id="balAdd" class="btn primary">Ajouter</button>
                    <button id="balSub" class="btn">Retirer</button>
                    <button id="balSaveLocal" class="btn">Enregistrer localement</button>
                </div>
                <p class="muted">Remarque: la modification est stockée localement. Pour persister côté serveur, ajoutez une route API côté serveur (ex: POST /api/update_balance).</p>
            </div>
        </div>
</div>
