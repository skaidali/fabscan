<div class="container">
    <header class="page-header">
        <div>
            <h1>Comptabilité</h1>
            <p class="muted">Gérer le portefeuille des utilisateurs.</p>
        </div>
    </header>

    <div class="card" id="balancePanel">
        <div class="flex-row form-group">
            <input id="balSearch" class="form-control" placeholder="Nom, prénom ou identifiant..." style="max-width: 400px;">
            <button id="balSearchBtn" class="btn btn-primary">Rechercher</button>
        </div>

        <div id="balResults" class="form-group"></div>

        <div id="balEditor" class="highlight-box" style="display: none;">
            <div class="card-header">
                <div>
                    <h3 id="balName"></h3>
                    <p class="muted">ID: <span id="balId"></span></p>
                </div>
                <div class="kpi-box" style="padding: 0.5rem 1rem;">
                    Solde: <strong id="balAmount" style="font-size: 1.5rem; color: var(--primary);">0.00</strong> €
                </div>
            </div>

            <div class="flex-row form-group">
                <input id="balDelta" type="number" step="0.01" class="form-control" placeholder="Montant (+/-)" style="max-width: 200px;">
                <button id="balAdd" class="btn btn-success" style="background: var(--success); color: white;">Ajouter</button>
                <button id="balSub" class="btn btn-danger">Retirer</button>
            </div>
            
            <button id="balSaveLocal" class="btn btn-outline form-group">Enregistrer localement</button>
            <p class="muted"><i class="fa-solid fa-circle-info"></i> Remarque: la modification est stockée localement. Prêt pour l'API serveur.</p>
        </div>
    </div>
</div>
