<div id="content">
        <h1>Comptabilité !!</h1>
        <p>Gérer les balances des utilisateurs — recherche par nom/prénom ou identifiant.</p>

        <!-- Balance panel (inline) -->
        <div id="balancePanel" style="background:white;padding:12px;border-radius:8px;border:1px solid #eee;max-width:880px;">
            <h2 style="margin-top:0">Gestion des soldes</h2>
            <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
                <input id="balSearch" placeholder="Nom, prénom ou identifiant" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px">
                <button id="balSearchBtn" class="btn primary">Rechercher</button>
            </div>

            <div id="balResults" style="margin-top:12px;max-height:220px;overflow:auto;border-top:1px solid #f0f0f0;padding-top:8px"></div>

            <div id="balEditor" style="display:none;margin-top:12px;border-top:1px solid #f0f0f0;padding-top:8px">
                <h3 id="balName"></h3>
                <p class="muted">ID: <span id="balId"></span></p>
                <p>Balance actuelle: <strong id="balAmount">0.00</strong> €</p>

                <div style="display:flex;gap:8px;align-items:center">
                    <input id="balDelta" type="number" step="0.01" placeholder="Montant (+/-)" style="padding:8px;border:1px solid #ddd;border-radius:6px">
                    <button id="balAdd" class="btn primary">Ajouter</button>
                    <button id="balSub" class="btn">Retirer</button>
                    <button id="balSaveLocal" class="btn">Enregistrer localement</button>
                </div>
                <p class="muted" style="margin-top:8px">Remarque: la modification est stockée localement. Pour persister côté serveur, ajoutez une route API côté serveur (ex: POST /api/update_balance).</p>
            </div>
        </div>
</div>

    <link rel="stylesheet" href="../assets/css/style.css">

    <script ref="bills.js"></script>
