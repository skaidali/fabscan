<div class="container">
    <header class="page-header flex-between">
        <div>
            <h1>Scanner & Accueil</h1>
            <p class="muted">Enregistrez les passages au FabLab (Scan ou Manuel).</p>
        </div>
        <div class="flex-row">
            <label class="pill" style="display:flex; align-items:center; gap:0.5rem; font-weight:bold; color:var(--primary); cursor:pointer; background:white; border: 2px solid var(--primary);">
                <input type="checkbox" id="auto-mode-toggle" style="width:1.2rem; height:1.2rem; cursor:pointer;"> 
                Mode Automatique
            </label>
        </div>
    </header>

    <div class="grid-2">
        <div class="card" id="user-panel" style="border-top: 4px solid var(--gray);">
            <div class="card-header">
                <strong>Profil scanné</strong>
            </div>
            
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <i class="fa-solid fa-circle-user" style="font-size: 5rem; color: var(--gray-light);"></i>
                <h2 id="panel-name" style="margin-top: 1rem;">En attente de scan...</h2>
                <div id="panel-status" class="pill" style="display: inline-block; margin-top: 0.5rem;">-</div>
            </div>

            <div class="form-group highlight-box">
                <div class="flex-between">
                    <span><i class="fa-solid fa-envelope"></i> Email</span>
                    <strong id="panel-email">-</strong>
                </div>
                <hr style="border-top: 1px solid var(--gray-light); margin: 0.5rem 0;">
                <div class="flex-between">
                    <span><i class="fa-solid fa-id-card"></i> Carte RFID liée</span>
                    <strong id="panel-rfid">-</strong>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <strong>Validation de l'entrée</strong>
            </div>
            <form id="entry-form">
                <input type="hidden" id="current-user-id" required>

                <div class="form-group">
                    <label for="manual-search">Recherche manuelle (Si oubli de carte)</label>
                    <input type="text" id="manual-search" class="form-control" list="users-list" placeholder="Taper un nom ou prénom..." autocomplete="off">
                    <datalist id="users-list"></datalist>
                </div>

                <div class="form-group">
                    <label for="motif">Motif de la visite *</label>
                    <select id="motif" class="form-control" required>
                        <option value="Projet d'Études">Projet d'Études</option>
                        <option value="Projet Personnel">Projet Personnel</option>
                        <option value="Visite">Visite</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="zone">Zone de travail *</label>
                    <select id="zone" class="form-control" required>
                        <option value="Impression 3D">Impression 3D</option>
                        <option value="Découpe Laser">Découpe Laser</option>
                        <option value="Électronique">Électronique</option>
                        <option value="Broderie / Couture">Broderie / Couture</option>
                        <option value="Outils manuels">Outils manuels</option>
                        <option value="Coworking">Coworking</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="commentaire">Commentaire (Optionnel)</label>
                    <input type="text" id="commentaire" class="form-control" placeholder="Ex: Matériel prêté...">
                </div>

                <button type="submit" class="btn btn-primary" id="btn-valider" style="width: 100%; justify-content: center;" disabled>
                    <i class="fa-solid fa-check"></i> Valider l'entrée
                </button>
                <div id="scan-message" class="muted form-group" style="margin-top: 1rem; text-align: center;"></div>
            </form>
        </div>
    </div>
</div>
