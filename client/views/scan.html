<div class="container">
    <header class="page-header">
        <div>
            <h1>Scanner les entrées</h1>
            <p class="muted">Contrôler les accès par code QR ou carte RFID.</p>
        </div>
    </header>

    <div class="grid-2">
        <section class="card">
            <h3>Contrôle du scanner</h3>
            <div id="scanned-info" class="highlight-box form-group">
                <span class="muted">En attente d'un badge ou d'un code...</span>
            </div>
            
            <div class="flex-row form-group">
                <button class="btn btn-primary" id="simulate-qr">Simuler QR</button>
                <button class="btn btn-outline" id="simulate-rfid">Simuler RFID</button>
            </div>
            
            <div class="form-group">
                <label for="manual-input">Saisie manuelle</label>
                <input id="manual-input" type="text" class="form-control" placeholder="Entrez l'ID du badge...">
            </div>
        </section>

        <section class="card">
            <h3>Enregistrement d'entrée</h3>
            <form id="arrival-form">
                <div class="form-group">
                    <label for="member-name">Nom du membre</label>
                    <input type="text" id="member-name" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label for="zone">Zone de destination</label>
                    <select id="zone" class="form-control">
                        <option value="2d">Espace 2D</option>
                        <option value="3d">Espace 3D</option>
                        <option value="electronics">MakerLab</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="submit-btn" type="button">Valider l'entrée</button>
            </form>
        </section>
    </div>
</div>
