<div class="container">
    <header class="page-header flex-between">
        <div>
            <h1>Scanner & Accueil</h1>
            <p class="muted">Enregistrez les passages au FabLab (Scan ou Manuel).</p>
        </div>
        <div class="flex-row">
            <label class="pill auto-mode-label">
                <input type="checkbox" id="auto-mode-toggle" class="auto-mode-checkbox"> 
                Mode Automatique
            </label>
        </div>
    </header>

    <div class="grid-2">
        <div>
            <div class="card form-group">
                <label for="manual-search"><i class="fa-solid fa-magnifying-glass"></i> Recherche manuelle (Si oubli de carte)</label>
                <input type="text" id="manual-search" class="form-control" list="users-list" placeholder="Taper un nom ou prénom..." autocomplete="off">
                <datalist id="users-list"></datalist>
            </div>

            <div class="card" id="user-panel">
                <div class="card-header">
                    <strong>Profil scanné</strong>
                </div>
                
                <div class="panel-avatar-container">
                    <i class="fa-solid fa-circle-user panel-avatar-icon"></i>
                    <h2 id="panel-name" class="panel-name">En attente de scan...</h2>
                    <div id="panel-status" class="pill panel-status">-</div>
                </div>

                <div class="form-group highlight-box">
                    <div class="flex-between">
                        <span><i class="fa-solid fa-user-tag"></i> Statut</span>
                        <strong id="panel-statut-detail">-</strong>
                    </div>
                    
                    <hr class="divider">

                    <div class="flex-between">
                        <span><i class="fa-solid fa-coins"></i> Solde</span>
                        <strong id="panel-solde">-</strong>
                    </div>
                    
                    <hr class="divider">
                    
                    <div class="flex-between">
                        <span><i class="fa-solid fa-id-card"></i> Carte RFID liée</span>
                        <strong id="panel-rfid">-</strong>
                    </div>

                    <hr class="divider">
                    <div style="font-weight: bold; margin-bottom: 0.5rem;">Certifications Machines</div>
                    <div id="panel-certifications-list"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <strong>Validation de l'entrée</strong>
            </div>
            <form id="entry-form">
                <input type="hidden" id="current-user-id" required>

                <div class="form-group">
                    <label for="motif">Motif de la visite *</label>
                    <select id="motif" class="form-control" required></select>
                </div>

                <div class="form-group">
                    <label for="zone">Zone de travail *</label>
                    <select id="zone" class="form-control" required></select>
                </div>

                <div class="form-group">
                    <label for="commentaire">Commentaire (Optionnel)</label>
                    <input type="text" id="commentaire" class="form-control" placeholder="Ex: Matériel prêté...">
                </div>

                <button type="submit" class="btn btn-primary w-100 flex-center" id="btn-valider" disabled>
                    <i class="fa-solid fa-check"></i> Valider l'entrée
                </button>
                <div id="scan-message" class="muted form-group text-center mt-1"></div>
            </form>
        </div>
    </div>
</div>
