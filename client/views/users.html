<div class="container">
    <header class="page-header">
        <h1 id="users-title">Gestion des Utilisateurs</h1>
        <a href="./views/registration.html" class="btn btn-primary" onclick="if(window.loadPage){event.preventDefault();const btn=window.findNavButtonByPage?window.findNavButtonByPage('./views/registration.html'):null;window.loadPage('./views/registration.html', btn);}">
            <i class="fa-solid fa-plus"></i> Nouvel Utilisateur
        </a>
    </header>

    <div class="card">
        <div class="flex-row flex-between form-group">
            <div class="flex-row" style="flex: 1; max-width: 400px;">
                <input type="search" id="users-search" class="form-control" placeholder="Rechercher par nom, prénom ou email..." name="query">
            </div>
            <select id="users-status-filter" class="form-control" style="width: auto;" name="status_filter" aria-label="Filtrer par statut">
                <option value="all">Tous les statuts</option>
                <option value="etudiants">Étudiant</option>
                <option value="personnel">Personnel</option>
                <option value="externes">Externe</option>
            </select>
        </div>

        <div class="table-wrap">
            <table class="data-table" aria-label="Liste des utilisateurs">
                <thead>
                    <tr>
                        <th>Prénom</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Statut</th>
                        <th>Carte RFID</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>

        <div id="users-table-state" class="muted form-group" role="status" aria-live="polite"></div>

        <div class="flex-row flex-between form-group" aria-label="Pagination utilisateurs">
            <button type="button" id="users-page-prev" class="btn btn-outline">Précédent</button>
            <div id="users-page-numbers"></div>
            <button type="button" id="users-page-next" class="btn btn-outline">Suivant</button>
        </div>
    </div>

    <template id="users-row-template">
        <tr>
            <td class="user-prenom"></td>
            <td class="user-nom"></td>
            <td class="user-email"></td>
            <td class="user-statut"></td>
            <td class="user-rfid"></td>
            <td>
                <div class="flex-row">
                    <button type="button" class="icon-btn action-edit" title="Éditer le profil"><i class="fa-solid fa-pen"></i></button>
                    <button type="button" class="icon-btn action-resend-qr" title="Renvoyer le QR code"><i class="fa-solid fa-rotate"></i></button>
                    <button type="button" class="icon-btn action-checkin" title="Pointage manuel"><i class="fa-solid fa-check"></i></button>
                    <button type="button" class="icon-btn action-delete" title="Supprimer l'utilisateur"><i class="fa-solid fa-trash"></i></button>
                </div>
            </td>
        </tr>
    </template>
</div>
