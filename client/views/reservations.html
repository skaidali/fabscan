<div class="container">
    <header class="page-header flex-between">
        <h1>Réservations</h1>
        <div class="flex-row">
            <label class="muted">Filtrer :</label>
            <select id="machineFilter" class="form-control" style="width: auto;">
                <option value="">Toutes les machines</option>
            </select>
            <button id="addBtn" class="btn btn-primary">+ Nouvelle réservation</button>
        </div>
    </header>

    <div class="card">
        <div class="card-header flex-between">
            <div class="flex-row">
                <button id="prevWeek" class="btn btn-outline">← Précédent</button>
                <button id="todayBtn" class="btn btn-outline">Cette semaine</button>
                <button id="nextWeek" class="btn btn-outline">Suivant →</button>
            </div>
            <strong id="weekRange" class="muted">—</strong>
        </div>

        <div id="calendarRoot" class="form-group">
            </div>
    </div>

    <div id="addModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <h3 id="addTitle" class="form-group">Ajouter une réservation</h3>
            <div id="addForm">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="r-date" class="form-control">
                </div>
                <div class="grid-2 form-group">
                    <div>
                        <label>Machine</label>
                        <select id="r-machine" class="form-control"></select>
                    </div>
                    <div>
                        <label>Créneau</label>
                        <select id="r-time" class="form-control"></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" id="r-name" class="form-control" placeholder="Nom de la personne">
                </div>
                <div class="form-group">
                    <label>Email (optionnel)</label>
                    <input type="email" id="r-email" class="form-control">
                </div>
                <div class="form-group">
                    <label>Raison</label>
                    <input type="text" id="r-reason" class="form-control">
                </div>
                <div class="flex-row">
                    <button id="addSave" class="btn btn-primary">Enregistrer</button>
                    <button id="addCancel" class="btn btn-outline">Annuler</button>
                </div>
            </div>
        </div>
    </div>

    <div id="viewModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <h3 class="form-group">Détails de la réservation</h3>
            <div id="viewContent" class="form-group highlight-box"></div>
            <div class="flex-row flex-between">
                <button id="viewDelete" class="btn btn-danger">Supprimer</button>
                <button id="viewClose" class="btn btn-outline">Fermer</button>
            </div>
        </div>
    </div>
</div>
