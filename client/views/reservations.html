<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reservations — Weekly machines</title>
  <link rel="stylesheet" href="reservations.css">
</head>
<body>
  <h1>Reservations — Cette semaine</h1>

  <div class="toolbar">
    <div>
      <button id="prevWeek" class="btn">← Précédent</button>
      <button id="nextWeek" class="btn">Suivant →</button>
      <button id="todayBtn" class="btn">Cette semaine</button>
      <button id="addBtn" class="btn primary">+ Ajouter réservation</button>
    </div>
    <div class="controls">
      <label class="muted">Machine</label>
      <select id="machineFilter">
        <option value="">Toutes les machines</option>
      </select>
    </div>
  </div>

  <div style="margin-bottom:8px"><span class="range" id="weekRange">—</span></div>

  <div class="calendar" id="calendarRoot">
    <!-- headers and grid generated by JS -->
  </div>

  <!-- Add modal -->
  <div id="addModal" class="modal" aria-hidden="true">
    <div class="panel">
      <h3 id="addTitle">Add reservation</h3>
      <div id="addForm">
        <label>Date <input type="date" id="r-date"></label>
        <label>Machine <select id="r-machine"></select></label>
        <label>Créneau <select id="r-time"></select></label>
        <label>Nom <input type="text" id="r-name" placeholder="Person name"></label>
        <label>Email (optionnel) <input type="email" id="r-email"></label>
        <label>Raison <input type="text" id="r-reason"></label>
        <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
          <button id="addCancel" class="btn">Cancel</button>
          <button id="addSave" class="btn primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- View modal -->
  <div id="viewModal" class="modal" aria-hidden="true">
    <div class="panel">
      <h3>Reservation</h3>
      <div id="viewContent"></div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
        <button id="viewClose" class="btn">Close</button>
        <button id="viewDelete" class="btn" style="background:#fff;border-color:var(--danger);color:var(--danger)">Delete</button>
      </div>
    </div>
  </div>

  <script src="reservations.js"></script>
</body>
</html>
