<div class="container">
    <header class="page-header">
        <div>
            <h1>Enregistrer un nouveau visiteur</h1>
            <p class="muted">Les champs marqués d'un astérisque (*) sont obligatoires.</p>
        </div>
    </header>

    <div class="card">
        <form id="registration-form">
            <div class="form-group">
                <label for="statut">Année d'études / Statut *</label>
                <select id="statut" name="statut" class="form-control" required>
                    <option value="" disabled selected>Sélectionnez une option</option>
                    <option value="1A">1A</option>
                    <option value="2A">2A</option>
                    <option value="3A">3A</option>
                    <option value="Master">Master</option>
                    <option value="Alternant·e">Alternant·e</option>
                    <option value="Doctorant·e">Doctorant·e</option>
                    <option value="Enseignant·e/Chercheur·se">Enseignant·e/Chercheur·se</option>
                    <option value="Personnel">Personnel</option>
                    <option value="Extérieur">Extérieur</option>
                </select>
            </div>

            <div class="grid-2 form-group">
                <div>
                    <label for="prenom">Prénom *</label>
                    <input type="text" id="prenom" name="prenom" class="form-control" required autocomplete="given-name">
                </div>
                <div>
                    <label for="nom">Nom *</label>
                    <input type="text" id="nom" name="nom" class="form-control" required autocomplete="family-name">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="prenom.nom@etu.ec-lyon.fr" autocomplete="email">
            </div>

            <div class="form-group">
                <label>Motif de la visite *</label>
                <div class="pill-group" role="radiogroup" aria-label="Motif de la visite">
                    <input type="radio" id="motif_etudes" name="motif" value="Projet d'Études" required>
                    <label class="pill" for="motif_etudes">Projet d'Études</label>

                    <input type="radio" id="motif_perso" name="motif" value="Projet Personnel">
                    <label class="pill" for="motif_perso">Projet Personnel</label>

                    <input type="radio" id="motif_formation" name="motif" value="Visite">
                    <label class="pill" for="motif_formation">Visite</label>

                    <input type="radio" id="motif_autre" name="motif" value="Autre">
                    <label class="pill" for="motif_autre">Autre</label>
                </div>
            </div>

            <div class="form-group highlight-box flex-between">
                <div>
                    <strong>Association carte RFID</strong>
                    <p class="muted">Liez une carte physique à cet utilisateur.</p>
                </div>
                <button type="button" id="rfid-associate-btn" class="btn btn-outline">Associer la carte</button>
                <input type="hidden" id="rfid_card_id" name="rfid_card_id" value="">
            </div>
            
            <div class="form-group flex-row">
                <input type="checkbox" id="send_qr_email" name="send_qr_email" checked style="width: 1.2rem; height: 1.2rem;">
                <label for="send_qr_email" style="margin: 0;">Envoyer le QR code par email</label>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--gray-light); margin: 1.5rem 0;">

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 0.75rem;">Enregistrer l'utilisateur</button>
            <div id="registration-message" class="muted form-group" role="status" aria-live="polite" style="margin-top: 1rem; text-align: center;"></div>
        </form>
    </div>
</div>
