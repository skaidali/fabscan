<div id="content">
    <div class="card">
        <h1>Machines</h1>
        <div class="muted">Gérer la liste des machines, leurs types et visualiser les créneaux disponibles.</div>
        <div >
            <button id="add-machine-btn" class="btn primary">+ Ajouter une machine</button>
            <button id="import-sample" class="btn">Charger exemple</button>
            <div id="api-status" ></div>
        </div>
    </div>

    <div class="card">
        <strong>Liste des machines</strong>
        <ul id="machines" class="machine-list" ></ul>
    </div>

    <div id="slots-card" class="card" >
        <div >
            <div><strong id="slots-title">Créneaux</strong><div class="muted" id="slots-sub"></div></div>
            <div><button id="close-slots" class="btn">Fermer</button></div>
        </div>
        <div id="slots-list" ></div>
        <div >
            <strong>Ajouter un créneau</strong>
            <div >
                <label>Date</label>
                <input type="date" id="slot-date">
                <label>Heure début</label>
                <input type="time" id="slot-start">
                <label>Heure fin</label>
                <input type="time" id="slot-end">
                <label>Type de créneau</label>
                <select id="slot-type">
                    <option value="horaire">Horaire (1h)</option>
                    <option value="atelier">Atelier</option>
                    <option value="maintenance">Maintenance</option>
                </select>
                <div >
                    <button id="add-slot-btn" class="btn primary">Ajouter le créneau</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Machine Modal -->
    <div id="add-modal" class="modal" >
        <div class="modal-content">
            <div >
                <h3 >Ajouter une machine</h3>
                <button class="btn" id="close-add">X</button>
            </div>
            <label>Nom</label>
            <input id="machine-name">
            <label>Type</label>
            <select id="machine-type">
                <option value="laser-cutter">Laser cutter</option>
                <option value="3d-printer">3D printer</option>
                <option value="cnc">CNC router</option>
                <option value="vinyl-cutter">Vinyl cutter</option>
                <option value="electronics-bench">Electronics bench</option>
            </select>
            <label>Description (optionnelle)</label>
            <textarea id="machine-desc"></textarea>
            <div >
                <button id="save-machine" class="btn primary">Enregistrer</button>
                <button id="cancel-machine" class="btn">Annuler</button>
            </div>
        </div>
    </div>

</div>
