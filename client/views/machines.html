<div class="container">
    <header class="page-header">
        <div>
            <h1>Gestion des machines</h1>
            <p class="muted">Gérer la liste des machines et visualiser les créneaux disponibles.</p>
        </div>
        <div class="flex-row">
            <button id="add-machine-btn" class="btn btn-primary"><i class="fa-solid fa-circle-plus"></i> Ajouter une machine</button>
            <button id="import-sample" class="btn btn-outline">Charger exemple</button>
        </div>
    </header>

    <div id="api-status" class="form-group"></div>

    <div class="card">
        <h3>Liste des équipements</h3>
        <ul id="machines" class="data-table" style="list-style: none; padding: 0;"></ul>
    </div>

    <div id="slots-card" class="card" style="display: none;">
        <div class="card-header">
            <div>
                <h3 id="slots-title">Créneaux</h3>
                <p class="muted" id="slots-sub"></p>
            </div>
            <button id="close-slots" class="btn btn-outline">Fermer</button>
        </div>
        
        <div id="slots-list" class="form-group"></div>
        
        <div class="highlight-box">
            <strong>Ajouter un créneau</strong>
            <div class="grid-3 form-group" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="slot-date" class="form-control">
                </div>
                <div class="form-group">
                    <label>Heure début</label>
                    <input type="time" id="slot-start" class="form-control">
                </div>
                <div class="form-group">
                    <label>Heure fin</label>
                    <input type="time" id="slot-end" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label>Type de créneau</label>
                <select id="slot-type" class="form-control">
                    <option value="horaire">Horaire (1h)</option>
                    <option value="atelier">Atelier</option>
                    <option value="maintenance">Maintenance</option>
                </select>
            </div>
            <button id="add-slot-btn" class="btn btn-primary">Ajouter le créneau</button>
        </div>
    </div>

    <div id="add-modal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <div class="card-header">
                <h3>Ajouter une machine</h3>
                <button class="btn btn-outline" id="close-add">X</button>
            </div>
            <div class="form-group">
                <label>Nom</label>
                <input id="machine-name" class="form-control">
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="machine-type" class="form-control">
                    <option value="laser-cutter">Découpeuse Laser</option>
                    <option value="3d-printer">Imprimante 3D</option>
                    <option value="cnc">Fraiseuse CNC</option>
                    <option value="vinyl-cutter">Découpeuse Vinyle</option>
                    <option value="electronics-bench">Établi Électronique</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description (optionnelle)</label>
                <textarea id="machine-desc" class="form-control" rows="3"></textarea>
            </div>
            <div class="flex-row">
                <button id="save-machine" class="btn btn-primary">Enregistrer</button>
                <button id="cancel-machine" class="btn btn-outline">Annuler</button>
            </div>
        </div>
    </div>
</div>
