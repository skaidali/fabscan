<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Statistiques – FabLab</title>
    <style>
        body{font-family:system-ui,sans-serif;margin:0}
        .wrap{max-width:1100px;margin:0 auto}
        .card{background:#fff;padding:1rem;border-radius:8px;box-shadow:0 6px 18px rgba(20,20,40,0.06);margin-bottom:1rem}
        .row{display:flex;gap:1rem}
        .col{flex:1}
        h1{margin:0 0 0.5rem}
        .kpi{display:flex;gap:1rem}
        .kpi .item{flex:1;padding:0.8rem;border-radius:6px;background:#f3f7ff;text-align:center}
        .kpi .val{font-size:1.6rem;font-weight:700}
        .controls{display:flex;gap:0.5rem;align-items:center}
        .btn{padding:0.4rem 0.6rem;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
        .btn.primary{background:#005bbb;color:#fff;border-color:#005bbb}
        .chart{display:flex;align-items:end;gap:6px;height:140px;padding:8px}
        .bar{flex:1;background:#cfe0ff;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;color:#04396b;font-weight:600}
        .bar .label{font-size:0.8rem;padding:6px}
        .legend{display:flex;gap:1rem;flex-wrap:wrap;margin-top:0.6rem}
        .legend-item{display:flex;gap:0.4rem;align-items:center}
        .dot{width:12px;height:12px;border-radius:3px;background:#0070f3}
        table{width:100%;border-collapse:collapse}
        th,td{padding:0.4rem;border-bottom:1px solid #eee;text-align:left}
        .muted{color:#666;font-size:0.9rem}
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Statistiques</h1>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div class="muted">Résumé</div>
                <div class="controls">
                    <button class="btn" id="refresh-btn">Actualiser</button>
                    <button class="btn primary" id="toggle-range">Afficher: Semaine</button>
                </div>
            </div>
            <div class="kpi" style="margin-top:0.75rem">
                <div class="item"><div class="muted">Nouveaux arrivants (aujourd'hui)</div><div id="today-count" class="val">—</div></div>
                <div class="item"><div class="muted">Activité (7 jours)</div><div id="week-count" class="val">—</div></div>
                <div class="item"><div class="muted">Entrées totales</div><div id="total-count" class="val">—</div></div>
            </div>
        </div>

        <div class="row">
            <div class="col card">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <div><strong>Activité</strong><div class="muted">Nombre d'entrées par jour</div></div>
                    <div class="muted">Période: <span id="range-label">7 derniers jours</span></div>
                </div>
                <div id="activity-chart" class="chart"></div>
                <div id="activity-xlabels" style="display:flex;justify-content:space-between;margin-top:6px;color:#444;font-size:0.9rem"></div>
            </div>

            <div class="col card" style="max-width:360px">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <div><strong>Utilisation par zone</strong><div class="muted">Répartition par zone de travail</div></div>
                    <div class="muted">Total: <span id="zone-total">—</span></div>
                </div>
                <div id="zone-list" style="margin-top:0.6rem"></div>
            </div>
        </div>

        <div class="card">
            <div><strong>Dernières entrées</strong> <span class="muted" id="entries-note"></span></div>
            <table id="entries-table" style="margin-top:0.6rem">
                <thead><tr><th>Date</th><th>Nom</th><th>Zone</th><th>Projet</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Fetch stats from server and entries, then compute charts
        const apiBase = '/api';
        let fullEntries = [];
        let currentRange = 'week'; // or 'month'

        async function fetchStats(){
            try{
                const s = await fetch(apiBase + '/stats');
                const stats = await s.json();
                document.getElementById('today-count').textContent = stats.today_entries ?? '—';
                document.getElementById('week-count').textContent = stats.week_entries ?? '—';
                document.getElementById('total-count').textContent = stats.total_entries ?? '—';
            }catch(e){
                console.error('stats fetch', e);
            }
        }

        async function fetchEntries(){
            try{
                // request a large limit so we can compute month view
                const r = await fetch(apiBase + '/entries?limit=1000');
                const arr = await r.json();
                // normalize: expect objects {date, statut, nom, prenom, type_projet, zone_travail, commentaire}
                fullEntries = arr.map(e => ({
                    date: new Date(e.date),
                    nom: e.nom,
                    prenom: e.prenom,
                    zone: e.zone_travail || e.zone || '',
                    projet: e.type_projet || e.projet || '',
                    commentaire: e.commentaire || ''
                }));
                renderEntriesTable();
                computeAndRender();
            }catch(e){
                console.error('entries fetch', e);
            }
        }

        function computeAndRender(){
            // determine date range days
            const now = new Date();
            const days = currentRange === 'week' ? 7 : 30;
            const buckets = [];
            for(let i=days-1;i>=0;i--){
                const d = new Date(now);
                d.setDate(now.getDate() - i);
                d.setHours(0,0,0,0);
                buckets.push({date:d,count:0});
            }

            const zoneCounts = {};

            fullEntries.forEach(e => {
                const d = new Date(e.date);
                d.setHours(0,0,0,0);
                // count in buckets
                const diffDays = Math.round((d - buckets[0].date)/(1000*60*60*24));
                if(diffDays >= 0 && diffDays < buckets.length){
                    buckets[diffDays].count++;
                }
                const z = e.zone || e.zone_travail || e.zone || 'Autre';
                zoneCounts[z] = (zoneCounts[z] || 0) + 1;
            });

            renderActivityChart(buckets);
            renderZoneList(zoneCounts);
        }

        function renderActivityChart(buckets){
            const chart = document.getElementById('activity-chart');
            const xlabels = document.getElementById('activity-xlabels');
            chart.innerHTML = '';
            xlabels.innerHTML = '';
            const max = Math.max(1, ...buckets.map(b=>b.count));
            buckets.forEach(b => {
                const h = Math.round((b.count / max) * 100);
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (h + '%');
                bar.innerHTML = `<div class="label">${b.count}</div>`;
                chart.appendChild(bar);
                const lbl = document.createElement('div');
                lbl.textContent = b.date.toLocaleDateString(undefined, {weekday:'short', day:'numeric'});
                xlabels.appendChild(lbl);
            });
            document.getElementById('range-label').textContent = currentRange === 'week' ? '7 derniers jours' : '30 derniers jours';
        }

        function renderZoneList(zoneCounts){
            const list = document.getElementById('zone-list');
            list.innerHTML = '';
            const total = Object.values(zoneCounts).reduce((s,v)=>s+v,0);
            document.getElementById('zone-total').textContent = total;
            const entries = Object.entries(zoneCounts).sort((a,b)=>b[1]-a[1]);
            entries.forEach(([zone,count])=>{
                const pct = total ? Math.round((count/total)*100) : 0;
                const div = document.createElement('div');
                div.style.display='flex'; div.style.justifyContent='space-between'; div.style.padding='6px 0';
                div.innerHTML = `<div>${zone}</div><div>${count} <span class="muted">(${pct} %)</span></div>`;
                list.appendChild(div);
            });
        }

        function renderEntriesTable(){
            const tbody = document.querySelector('#entries-table tbody');
            tbody.innerHTML = '';
            fullEntries.slice(0,50).forEach(e=>{
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${e.date.toLocaleString()}</td><td>${e.prenom} ${e.nom}</td><td>${e.zone}</td><td>${e.projet}</td>`;
                tbody.appendChild(tr);
            });
            document.getElementById('entries-note').textContent = `Affiche ${Math.min(50, fullEntries.length)} dernières entrées`;
        }

        // UI wiring
        document.getElementById('refresh-btn').addEventListener('click', ()=>{ fetchStats(); fetchEntries(); });
        document.getElementById('toggle-range').addEventListener('click', (e)=>{
            currentRange = currentRange === 'week' ? 'month' : 'week';
            e.target.textContent = currentRange === 'week' ? 'Afficher: Semaine' : 'Afficher: Mois';
            computeAndRender();
        });

        // initial load
        fetchStats();
        fetchEntries();
    </script>
</body>
</html>
